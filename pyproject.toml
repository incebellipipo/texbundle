[build-system]
requires = ["setuptools>=69.3", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texbundle"
authors = [
  { name="Emir Cem Gezer", email="me@emircem.com"}
]
description = "A Python package for bundling LaTeX files into a single zip file."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
dynamic = ["version", "dependencies"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent"
]

keywords = ["latex", "tex", "pdf", "bundle"]

[project.scripts]
texbundle = "texbundle.bundle:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]

[tool.setuptools_scm]
# Basic setuptools-scm config: derive version from git tags.
# No write_to/version_file needed; importlib.metadata reads dist metadata.
version_scheme = 'post-release'
fallback_version = "0.0.0"